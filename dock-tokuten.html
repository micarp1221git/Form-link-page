<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex">
<title>先着10名の方へ｜声の人間ドック</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--coral:#E8815B;--cream:#FFF8F5;--ink:#3D3535;--line:#F0D9CF}
*{box-sizing:border-box} body{margin:0;background:var(--cream);color:var(--ink);font-family:"Noto Sans JP",sans-serif;line-height:1.9;font-size:16px}
.wrap{max-width:560px;margin:0 auto;padding:32px 20px 64px} h1{font-size:22px;margin:0 0 8px} .lead{margin:0 0 24px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px} label.opt{display:block;padding:12px 10px;border:1px solid var(--line);border-radius:10px;margin:8px 0;cursor:pointer}
label.opt input{margin-right:8px} .sub{display:none;margin-top:14px;padding-top:10px;border-top:1px dashed var(--line)} .sub.on{display:block}
input[type=text],input[type=email],input[type=url]{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px;margin:6px 0 12px}
.btn{display:block;width:100%;background:var(--coral);color:#fff;border:0;font-weight:700;font-size:18px;padding:16px;border-radius:999px;margin-top:16px}
.small{font-size:14px;color:#6b5f5f} .done{display:none} .sign{margin-top:28px;font-size:14px}
</style></head><body><div class="wrap">
<h1>先着10名の方へ</h1>
<p class="lead">声の人間ドック、お申し込みありがとうございます。<br>先着10名の方に「あなたの声の分析」の音声をお渡しします。ご希望を選んでください。</p>
<form id="f" class="card">
  <label>メールアドレス（お申し込みのもの）</label><input type="email" id="email" required>
  <label class="opt"><input type="radio" name="c" value="A" required>A. Voicyの配信で紹介してよい</label>
  <label class="opt"><input type="radio" name="c" value="B">B. Voicyでは紹介しない（あなたにだけ音声をお渡しします）</label>
  <label class="opt"><input type="radio" name="c" value="C">C. 声の分析のプレゼントは不要</label>
  <div class="sub" id="subA">
    <p class="small">Aを選んだ方へ</p>
    <label>紹介してほしいお名前（ニックネームでも）</label><input type="text" id="name">
    <label>ふりがな</label><input type="text" id="kana">
    <label>音声配信をされている方は、チャンネルのURL<br><span class="small">配信の冒頭のご挨拶を、分析会で流させていただきます</span></label><input type="url" id="ch" placeholder="https://">
  </div>
  <button class="btn" type="submit" id="btn">送信する</button>
</form>
<div class="card done" id="done"><p>ありがとうございます。<br>分析結果レポートが届くのをお楽しみに。</p><p class="sign">ボイストレーナーみか</p></div>
<script>
var GAS_URL='https://script.google.com/macros/s/AKfycbzelUSgmUzxitKZ6qH5AEkKyY3b0DbWAMtcRKKDL-KeVyHrNKfONVfSxkKV2W9oAOGpkg/exec', TOKEN='voicekarte2026secret';
document.querySelectorAll('input[name=c]').forEach(function(r){r.addEventListener('change',function(){document.getElementById('subA').classList.toggle('on',this.value==='A');});});
document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();var b=document.getElementById('btn');b.disabled=true;b.textContent='送っています…';
var c=(document.querySelector('input[name=c]:checked')||{}).value||'';
fetch(GAS_URL,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain'},body:JSON.stringify({token:TOKEN,kind:'dock-tokuten',email:document.getElementById('email').value,choice:c,name:document.getElementById('name').value,kana:document.getElementById('kana').value,channel:document.getElementById('ch').value})})
.then(function(r){return r.json();}).then(function(j){if(j&&j.ok){document.getElementById('f').style.display='none';document.getElementById('done').style.display='block';}else{alert('送れませんでした。時間をおいてもう一度お試しください。');b.disabled=false;b.textContent='送信する';}})
.catch(function(){alert('送れませんでした。時間をおいてもう一度お試しください。');b.disabled=false;b.textContent='送信する';});});
</script></div></body></html>
