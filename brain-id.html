<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BrainのIDの見つけ方</title>
<meta name="robots" content="noindex">
<style>
:root{--navy:#24375a;--ink:#2f3440;--sub:#5f6470;--paper:#fbfaf6;--orange:#ec5a28;--line:#d9d5ca}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.8;font-size:16px;word-break:keep-all;overflow-wrap:anywhere}
img{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
.wrap{max-width:520px;margin:0 auto;padding:36px 16px 56px}
h1{font-size:22px;color:var(--navy);line-height:1.5;margin-bottom:8px}
.lead{color:var(--sub);font-size:14px;margin-bottom:28px}
.step{margin-bottom:32px}
.step h2{font-size:17px;line-height:1.6;margin-bottom:10px}
.step h2 span{display:inline-block;background:var(--navy);color:#fff;font-size:13px;padding:0 9px;margin-right:8px;border-radius:3px}
.note{font-size:14px;color:var(--sub);margin-top:10px}
.note b{color:var(--orange)}
.back{display:block;text-align:center;background:var(--navy);color:#fff;text-decoration:none;font-weight:700;padding:16px;border-radius:4px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>BrainのIDの見つけ方</h1>
  <p class="lead">Brainにログインした画面で見られます。</p>

  <div class="step">
    <h2><span>1</span>右上の丸いアイコンを押す</h2>
    <img src="img/brain-id/step1.jpg" alt="Brainの画面の右上にある丸いアイコン" width="1302" height="170">
  </div>

  <div class="step">
    <h2><span>2</span>メニューのいちばん上の英数字がIDです</h2>
    <img src="img/brain-id/step2.jpg" alt="メニューのいちばん上に出るIDと、プロフィールを見る" width="1320" height="420">
    <p class="note">この見本では <b>micarp</b> がIDです。<br>あなたの画面では、ここにあなたのIDが出ます。</p>
  </div>

  <div class="step">
    <h2><span>3</span>「プロフィールを見る」からも分かります</h2>
    <img src="img/brain-id/step3.jpg" alt="プロフィールの名前の下に出るID" width="1302" height="320">
    <p class="note">名前の下に出る英数字が、同じIDです。</p>
  </div>

  <a class="back" href="keisuke-ccmaster.html#claim">特典の受け取りに戻る</a>
</div>
</body>
</html>
