<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --coral:       #E8815B;
    --coral-deep:  #C9663F;
    --coral-soft:  #FDEFE8;
    --coral-line:  #F3DDD2;
    --bg:          #FFF8F5;
    --ink:         #3D3535;
    --ink-soft:    #97837C;
    --card:        #FFFFFF;
    --shadow: 0 10px 34px rgba(201, 102, 63, .10);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    line-height: 1.9;
  }
  .wrap { width: 100%; max-width: 480px; }
  .brand { text-align: center; font-size: 12px; letter-spacing: .18em; color: var(--ink-soft); margin-bottom: 28px; }
  .card { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: 36px 28px 32px; }
  h1 { font-size: 22px; font-weight: 700; line-height: 1.7; letter-spacing: .02em; margin-bottom: 22px; }
  h1 .accent { color: var(--coral-deep); }
  h2 { font-size: 17px; font-weight: 700; line-height: 1.7; margin-bottom: 14px; }
  p { font-size: 15px; margin-bottom: 18px; }
  .divider { border: none; border-top: 1px solid var(--coral-line); margin: 30px 0; }
  .announce { background: var(--coral-soft); border-radius: 12px; padding: 18px 20px; font-size: 15px; margin-bottom: 24px; }
  .announce strong { color: var(--coral-deep); font-weight: 700; }
  .panel { border: 1px solid var(--coral-line); border-radius: 14px; padding: 24px 22px 22px; background: #fff; }
  .cta {
    display: block; text-align: center; background: var(--coral); color: #fff; text-decoration: none;
    font-size: 16px; font-weight: 700; letter-spacing: .04em; border-radius: 999px; padding: 16px 20px;
    box-shadow: 0 6px 18px rgba(232, 129, 91, .35); transition: transform .15s ease, box-shadow .2s ease;
  }
  .cta:hover { box-shadow: 0 8px 22px rgba(232, 129, 91, .45); }
  .cta:active { transform: scale(.98); }
  .lead-in { text-align: center; color: var(--coral-deep); font-weight: 700; font-size: 14px; letter-spacing: .06em; margin-bottom: 12px; }
  .note { margin-top: 14px; font-size: 12px; color: var(--ink-soft); text-align: center; line-height: 1.7; }
  .footer { margin-top: 26px; text-align: center; font-size: 12px; color: var(--ink-soft); }
  @media (min-width: 760px) {
    body { padding: 64px 24px; }
    .wrap { max-width: 760px; }
    .brand { font-size: 13px; margin-bottom: 34px; }
    .card { padding: 56px 64px 48px; border-radius: 22px; }
    h1 { font-size: 30px; margin-bottom: 26px; }
    h2 { font-size: 20px; }
    p { font-size: 16.5px; }
    .announce { font-size: 16.5px; padding: 24px 28px; }
    .panel { padding: 32px 34px 30px; }
    .cta { max-width: 420px; margin: 0 auto; font-size: 17px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>来年は、いちばん<span class="accent">先に</span>お届けします</h1>

      <p>事前登録、ありがとうございます。</p>

      <p>次の「声の人間ドック」は、2027年の9月です。<br>受付が始まる前に、ご登録のメールアドレスへお知らせが届きます。</p>

      <div class="announce">
        ・開催は<strong>年に1回・9月</strong>です<br>
        ・<strong>受付開始の前</strong>にご案内が届きます<br>
        ・定員があるので、案内が届いた日がいちばん取りやすい日です
      </div>

      <hr class="divider">

      <div class="panel">
        <p class="lead-in">＼ 来年を待たずに ／</p>
        <h2>自分の声の使い方が、ひとつずつ分かります</h2>

        <p>喉を痛めない話し方、相手に届く声の出し方。<br>今日から試せるものを、メールでお届けしています。</p>

        <a class="cta" href="https://experisent.systeme.io/b8067cff">メールで受け取る（無料）</a>
        <p class="note">登録した日から届きます。</p>
      </div>
    </div>
    <div class="footer">ボイストレーナーみか</div>
  </div>
</body>
</html>
